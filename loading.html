<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salescope - Initializing</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --bg-start: #0f172a;
            --bg-end: #1e293b;
            --text: #f8fafc;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: radial-gradient(circle at center, var(--bg-end), var(--bg-start));
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            color: var(--text);
            overflow: hidden;
        }

        .glass-container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            padding: 3.5rem 5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-wrapper {
            position: relative;
            margin-bottom: 2.5rem;
        }

        .logo-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 140%;
            height: 140%;
            background: var(--primary-glow);
            filter: blur(40px);
            border-radius: 50%;
            z-index: -1;
            animation: pulseGlow 3s infinite ease-in-out;
        }

        .logo {
            width: 140px;
            height: auto;
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.3));
            animation: float 4s infinite ease-in-out;
        }

        @keyframes pulseGlow {

            0%,
            100% {
                opacity: 0.3;
                transform: translate(-50%, -50%) scale(1);
            }

            50% {
                opacity: 0.6;
                transform: translate(-50%, -50%) scale(1.1);
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .brand-name {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(to right, #fff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .status-text {
            font-size: 0.95rem;
            font-weight: 500;
            color: #94a3b8;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 2.5rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .dot-pulse {
            position: relative;
            width: 6px;
            height: 6px;
            border-radius: 5px;
            background-color: var(--primary);
            color: var(--primary);
            animation: dotPulse 1.5s infinite linear;
            box-shadow: 0 0 10px var(--primary);
        }

        @keyframes dotPulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.5);
                opacity: 0.7;
            }

            100% {
                transform: scale(1);
            }
        }

        .loader-track {
            width: 280px;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .loader-bar {
            position: absolute;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg,
                    transparent,
                    var(--primary),
                    #818cf8,
                    var(--primary),
                    transparent);
            animation: loading 2.5s infinite cubic-bezier(0.65, 0, 0.35, 1);
        }

        @keyframes loading {
            0% {
                left: -100%;
            }

            100% {
                left: 100%;
            }
        }

        .footer-note {
            position: absolute;
            bottom: 2rem;
            font-size: 0.75rem;
            color: #475569;
            font-weight: 600;
            letter-spacing: 0.05em;
        }
    </style>
</head>

<body>
    <div class="glass-container">
        <div class="logo-wrapper">
            <div class="logo-glow"></div>
            <img src="Salescope.png" alt="Salescope" class="logo">
        </div>

        <div class="brand-name">Salescope</div>

        <div class="status-text">
            <span>Starting App</span>
            <div class="dot-pulse"></div>
        </div>

        <div class="loader-track">
            <div class="loader-bar"></div>
        </div>
    </div>

    <div class="footer-note">POWERED BY SALESCOPE.SOFTWARE</div>
</body>

</html>
